          package com.jarvis.app
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.work.*
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit

          /** Every ~15 min: checks newest YouTube video; alerts if views gained >= your threshold. */
          class ViralWorker(c: Context, p: WorkerParameters) : Worker(c, p) {
              companion object {
                  fun schedule(c: Context) {
                      WorkManager.getInstance(c).enqueueUniquePeriodicWork("viral", ExistingPeriodicWorkPolicy.UPDATE,
                          PeriodicWorkRequestBuilder<ViralWorker>(15, TimeUnit.MINUTES)
                              .setConstraints(Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build()).build())
                  }
              }

              override fun doWork(): Result {
                  Prefs.init(applicationContext)
                  val key = Prefs.get("ytKey"); val ch = Prefs.get("ytChannel")
                  if (key.isBlank() || ch.isBlank()) return Result.success()
                  val thresh = Prefs.get("ytThresh", "1000").toLongOrNull() ?: 1000L
                  try {
                      val s = JSONObject(Net.get("https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=$ch&order=date&maxResults=1&type=video&key=$key"))
                      val v = s.getJSONArray("items").getJSONObject(0)
                      val id = v.getJSONObject("id").getString("videoId")
                      val title = v.getJSONObject("snippet").getString("title")
                      val st = JSONObject(Net.get("https://www.googleapis.com/youtube/v3/videos?part=statistics&id=$id&key=$key"))
                      val views = st.getJSONArray("items").getJSONObject(0).getJSONObject("statistics").getString("viewCount").toLong()
                      val last = Prefs.get("lastViews_$id", "-1").toLong()
                      Prefs.set("lastViews_$id", views.toString())
                      if (last >= 0 && views - last >= thresh)
                          alert(Prefs.get("user", "Sir") + ", your video is going viral!", "\"$title\" gained ${views - last} views in ~15 min (total $views).")
                  } catch (e: Exception) { return Result.retry() }
                  return Result.success()
              }

              private fun alert(t: String, b: String) {
                  val c = applicationContext
                  val nm = c.getSystemService(NotificationManager::class.java)
                  if (Build.VERSION.SDK_INT >= 26) nm.createNotificationChannel(NotificationChannel("viral", "Viral alerts", NotificationManager.IMPORTANCE_HIGH))
                  val pi = PendingIntent.getActivity(c, 0, Intent(c, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = (if (Build.VERSION.SDK_INT >= 26) Notification.Builder(c, "viral") else Notification.Builder(c))
                      .setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(t).setContentText(b)
                      .setStyle(Notification.BigTextStyle().bigText(b))
                      .setCategory(Notification.CATEGORY_CALL).setFullScreenIntent(pi, true).setContentIntent(pi).setAutoCancel(true).build()
                  nm.notify(42, n)
              }
          }
