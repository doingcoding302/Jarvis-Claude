          package com.jarvis.app
          import android.animation.ValueAnimator
          import android.app.*
          import android.content.*
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.*
          import android.speech.*
          import android.view.*
          import android.widget.*
          import java.util.Calendar

          class OverlayService : Service() {
              companion object { var running = false }
              private val h = Handler(Looper.getMainLooper())
              private lateinit var wm: WindowManager
              private lateinit var orb: OrbView
              private lateinit var wave: WaveView
              private lateinit var caption: TextView
              private lateinit var panel: LinearLayout
              private lateinit var lp: WindowManager.LayoutParams
              private var sr: SpeechRecognizer? = null
              private val hide = Runnable { fade(false) }
              private val unlock = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      val hr = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                      val g = if (hr < 12) "Good morning" else if (hr < 18) "Good afternoon" else "Good evening"
                      speakOut("$g, ${Prefs.get("user", "Sir")}. ${Prefs.get("name", "Jarvis")} online and at your service.")
                  }
              }
              override fun onBind(i: Intent?): IBinder? = null
              override fun onStartCommand(i: Intent?, f: Int, id: Int) = START_STICKY

              @Suppress("DEPRECATION")
              private fun overlayType() = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE

              override fun onCreate() {
                  super.onCreate(); Prefs.init(this); Voice.init(this); running = true
                  val nm = getSystemService(NotificationManager::class.java)
                  if (Build.VERSION.SDK_INT >= 26) nm.createNotificationChannel(NotificationChannel("svc", "Jarvis", NotificationManager.IMPORTANCE_MIN))
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = (if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, "svc") else Notification.Builder(this))
                      .setContentTitle("Jarvis is online").setSmallIcon(android.R.drawable.ic_btn_speak_now).setContentIntent(pi).build()
                  startForeground(1, n)
                  registerReceiver(unlock, IntentFilter(Intent.ACTION_USER_PRESENT))
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  buildPanel(); buildOrb()
              }

              private fun buildPanel() {
                  val d = resources.displayMetrics.density
                  wave = WaveView(this)
                  caption = TextView(this).apply { setTextColor(Color.WHITE); textSize = 16f; gravity = Gravity.CENTER; maxLines = 6; setPadding(0, (8 * d).toInt(), 0, 0) }
                  panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable().apply { cornerRadius = 28 * d; setColor(0xEB05102A.toInt()); setStroke((1.5f * d).toInt(), 0xAA00E5FF.toInt()) }
                      setPadding((20 * d).toInt(), (14 * d).toInt(), (20 * d).toInt(), (18 * d).toInt())
                      addView(wave, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (56 * d).toInt()))
                      addView(caption, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                      alpha = 0f; visibility = View.GONE
                  }
                  val w = minOf(resources.displayMetrics.widthPixels * 0.92f, 420 * d).toInt()
                  val pp = WindowManager.LayoutParams(w, WindowManager.LayoutParams.WRAP_CONTENT, overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE, PixelFormat.TRANSLUCENT)
                  pp.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL; pp.y = (80 * d).toInt()
                  wm.addView(panel, pp)
              }

              private fun buildOrb() {
                  orb = OrbView(this)
                  val s = (76 * resources.displayMetrics.density).toInt()
                  lp = WindowManager.LayoutParams(s, s, overlayType(), WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, PixelFormat.TRANSLUCENT)
                  lp.gravity = Gravity.TOP or Gravity.START; lp.x = 16; lp.y = 400
                  var dx = 0f; var dy = 0f; var sx = 0; var sy = 0; var moved = false
                  orb.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { dx = e.rawX; dy = e.rawY; sx = lp.x; sy = lp.y; moved = false }
                          MotionEvent.ACTION_MOVE -> {
                              if (Math.abs(e.rawX - dx) > 12 || Math.abs(e.rawY - dy) > 12) moved = true
                              if (moved) { lp.x = sx + (e.rawX - dx).toInt(); lp.y = sy + (e.rawY - dy).toInt(); wm.updateViewLayout(orb, lp) }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) listen() else {
                              val sw = resources.displayMetrics.widthPixels
                              val to = if (lp.x + s / 2 < sw / 2) 0 else sw - s
                              ValueAnimator.ofInt(lp.x, to).apply {
                                  duration = 220
                                  addUpdateListener { lp.x = it.animatedValue as Int; if (orb.isAttachedToWindow) wm.updateViewLayout(orb, lp) }
                              }.start()
                          }
                      }
                      true
                  }
                  wm.addView(orb, lp)
              }

              private fun fade(show: Boolean) {
                  if (show) { panel.animate().cancel(); panel.visibility = View.VISIBLE; panel.animate().alpha(1f).setDuration(180).start() }
                  else panel.animate().alpha(0f).setDuration(250).withEndAction { panel.visibility = View.GONE }.start()
              }

              private fun ui(s: Int, t: String) {
                  h.removeCallbacks(hide)
                  orb.state = s
                  wave.amp = when (s) { 1 -> 0.7f; 2 -> 0.25f; 3 -> 0.75f; else -> 0.12f }
                  caption.text = t
                  fade(true)
              }

              private fun idle() { orb.state = 0; wave.amp = 0.12f; h.postDelayed(hide, 3000) }

              private fun speakOut(t: String) { ui(3, t); Voice.speak(t, onEnd = { idle() }) }

              private fun listen() {
                  if (checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Open Jarvis and grant the microphone", Toast.LENGTH_LONG).show(); return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) { Toast.makeText(this, "Speech recognition unavailable", Toast.LENGTH_LONG).show(); return }
                  Voice.stop(); sr?.destroy()
                  ui(1, "Hi ${Prefs.get("user", "Sir")}, how can I help you…")
                  sr = SpeechRecognizer.createSpeechRecognizer(this)
                  sr?.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(r: Bundle?) {
                          val t = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          if (t == null) { ui(0, "I didn't catch that."); idle(); return }
                          ui(2, "“$t”")
                          if (!Actions.handle(this@OverlayService, t) { speakOut(it) }) Brain.ask(t) { speakOut(it) }
                      }
                      override fun onPartialResults(b: Bundle?) { b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()?.let { caption.text = it } }
                      override fun onRmsChanged(v: Float) { val l = v.coerceIn(0f, 10f) / 10f; wave.amp = 0.2f + l * 0.8f; orb.level = l }
                      override fun onError(e: Int) {
                          val quiet = e == SpeechRecognizer.ERROR_NO_MATCH || e == SpeechRecognizer.ERROR_SPEECH_TIMEOUT
                          ui(0, if (quiet) "I didn't catch that." else "Voice error $e"); idle()
                      }
                      override fun onReadyForSpeech(p: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onEvent(t: Int, b: Bundle?) {}
                  })
                  sr?.startListening(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, Prefs.get("lang", "en-US")))
              }

              override fun onDestroy() {
                  running = false
                  try { unregisterReceiver(unlock) } catch (e: Exception) {}
                  sr?.destroy(); Voice.stop()
                  if (::orb.isInitialized) wm.removeView(orb)
                  if (::panel.isInitialized) wm.removeView(panel)
                  super.onDestroy()
              }
          }
