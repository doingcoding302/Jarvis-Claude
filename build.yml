              fun AlertsTab(dark: Boolean) {
                  Glass(dark) {
                      Text("YOUTUBE VIRAL ALERTS", fontWeight = FontWeight.Bold, letterSpacing = 2.sp)
                      PrefField("YouTube Data API key", "ytKey", "", true)
                      PrefField("Channel ID (starts with UC)", "ytChannel")
                      PrefField("Alert if views gained in ~15 min reach", "ytThresh", "1000")
                      Hint("Checks every 15 minutes in the background. Say \"how is my channel\" anytime for live stats.")
                  }
              }

              @Composable
              fun ProfileTab(dark: Boolean, onDark: (Boolean) -> Unit) {
                  Glass(dark) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text("Dark theme", Modifier.weight(1f))
                          Switch(dark, { Prefs.set("dark", if (it) "1" else "0"); onDark(it) })
                      }
                  }
                  Glass(dark) {
                      PrefField("Assistant name", "name", "Jarvis")
                      PrefField("Call me", "user", "Sir")
                      Text("MODE", fontWeight = FontWeight.Bold, letterSpacing = 2.sp)
                      PrefChips("mode", listOf("personal", "commercial"), "personal")
                      Text("LANGUAGE", fontWeight = FontWeight.Bold, letterSpacing = 2.sp)
                      PrefChips("lang", listOf("en-US", "en-GB", "hi-IN", "es-ES", "fr-FR", "de-DE", "ar-SA", "pt-BR", "ja-JP", "ko-KR"), "en-US")
                  }
              }

              @Composable fun Hint(s: String) = Text(s, fontSize = 12.sp, color = LocalContentColor.current.copy(.65f))

              @Composable
              fun Check(label: String, ok: Boolean, fix: () -> Unit) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text(if (ok) "✅" else "⚠️"); Spacer(Modifier.width(10.dp)); Text(label, Modifier.weight(1f))
                      if (!ok) TextButton(fix) { Text("Fix") }
                  }
              }

              @Composable
              fun Stat(title: String, value: String, dark: Boolean, mod: Modifier) {
                  Glass(dark, mod) {
                      Text(title, fontSize = 11.sp, letterSpacing = 2.sp, color = MaterialTheme.colorScheme.primary)
                      Text(value, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                  }
              }

              @Composable
              fun Glass(dark: Boolean, mod: Modifier = Modifier, content: @Composable ColumnScope.() -> Unit) {
                  val sh = RoundedCornerShape(22.dp)
                  Column(mod.fillMaxWidth().clip(sh).background(if (dark) Color.White.copy(.07f) else Color.White.copy(.6f))
                      .border(1.dp, if (dark) Color(0x5500E5FF) else Color.White, sh).padding(16.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp), content = content)
              }

              @Composable
              fun PrefField(label: String, k: String, def: String = "", secret: Boolean = false) {
                  var v by remember { mutableStateOf(Prefs.get(k, def)) }
                  OutlinedTextField(v, { v = it; Prefs.set(k, it.trim()) }, label = { Text(label) }, singleLine = true,
                      modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(16.dp),
                      visualTransformation = if (secret) PasswordVisualTransformation() else VisualTransformation.None)
              }

              @Composable
              fun PrefChips(k: String, opts: List<String>, def: String, onPick: (String) -> Unit = {}) {
                  var v by remember { mutableStateOf(Prefs.get(k, def)) }
                  Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      opts.forEach { o -> FilterChip(v == o, { v = o; Prefs.set(k, o); onPick(o) }, { Text(o) }) }
                  }
              }
          }
