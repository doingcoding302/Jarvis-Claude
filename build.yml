# JARVIS ANDROID - single-file build. Put this file at .github/workflows/build.yml
# It writes the whole Android project at build time, compiles it, and publishes the APK as a GitHub Release.
name: Build Jarvis APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Write project files
        run: |
          set -e
          mkdir -p jarvis
          cd jarvis
          mkdir -p $(dirname 'settings.gradle.kts')
          cat > 'settings.gradle.kts' <<'JVEOF0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Jarvis"
          include(":app")
          JVEOF0
          mkdir -p $(dirname 'build.gradle.kts')
          cat > 'build.gradle.kts' <<'JVEOF1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          JVEOF1
          mkdir -p $(dirname 'gradle.properties')
          cat > 'gradle.properties' <<'JVEOF2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          JVEOF2
          mkdir -p $(dirname 'app/build.gradle.kts')
          cat > 'app/build.gradle.kts' <<'JVEOF3'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.jarvis.app"
              compileSdk = 34
              defaultConfig { applicationId = "com.jarvis.app"; minSdk = 24; targetSdk = 34; versionCode = 2; versionName = "2.0" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.work:work-runtime-ktx:2.9.1")
          }
          JVEOF3
          mkdir -p $(dirname 'app/src/main/res/values/themes.xml')
          cat > 'app/src/main/res/values/themes.xml' <<'JVEOF4'
          <resources><style name="Theme.Jarvis" parent="android:Theme.Material.NoActionBar"><item name="android:windowBackground">#040A18</item></style></resources>
          JVEOF4
          mkdir -p $(dirname 'app/src/main/res/values/strings.xml')
          cat > 'app/src/main/res/values/strings.xml' <<'JVEOF5'
          <resources><string name="acc_desc">Lets Jarvis press buttons, scroll, go home/back and take screenshots when you ask.</string></resources>
          JVEOF5
          mkdir -p $(dirname 'app/src/main/res/xml/accessibility_config.xml')
          cat > 'app/src/main/res/xml/accessibility_config.xml' <<'JVEOF6'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="100"/>
          JVEOF6
          mkdir -p $(dirname 'app/src/main/AndroidManifest.xml')
          cat > 'app/src/main/AndroidManifest.xml' <<'JVEOF7'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <application android:label="Jarvis" android:icon="@android:drawable/ic_btn_speak_now" android:theme="@style/Theme.Jarvis">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:exported="false" android:foregroundServiceType="microphone"/>
                  <service android:name=".JarvisAccess" android:exported="true" android:label="Jarvis" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/>
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
                  </receiver>
              </application>
          </manifest>
          JVEOF7
          mkdir -p $(dirname 'app/src/main/java/com/jarvis/app/Prefs.kt')
          cat > 'app/src/main/java/com/jarvis/app/Prefs.kt' <<'JVEOF8'
          package com.jarvis.app
          import android.content.Context
          import android.content.SharedPreferences
          object Prefs {
              private lateinit var sp: SharedPreferences
              fun init(c: Context) { if (!::sp.isInitialized) sp = c.applicationContext.getSharedPreferences("jarvis", 0) }
              fun get(k: String, d: String = "") = sp.getString(k, d) ?: d
              fun set(k: String, v: String) = sp.edit().putString(k, v).apply()
          }
          JVEOF8
          mkdir -p $(dirname 'app/src/main/java/com/jarvis/app/Brain.kt')
          cat > 'app/src/main/java/com/jarvis/app/Brain.kt' <<'JVEOF9'
          package com.jarvis.app
          import android.os.Handler
          import android.os.Looper
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Date
          import kotlin.concurrent.thread

          object Net {
              fun post(url: String, h: Map<String, String>, body: JSONObject): ByteArray {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.requestMethod = "POST"; c.doOutput = true; c.connectTimeout = 10000; c.readTimeout = 30000
                  c.setRequestProperty("content-type", "application/json")
                  h.forEach { (k, v) -> c.setRequestProperty(k, v) }
                  c.outputStream.use { it.write(body.toString().toByteArray()) }
                  val ok = c.responseCode in 200..299
                  val bytes = (if (ok) c.inputStream else c.errorStream).readBytes()
                  if (!ok) throw Exception("HTTP ${c.responseCode} " + String(bytes).take(160))
                  return bytes
              }
              fun get(url: String): String = URL(url).readText()
          }

          /** Providers: groq (free), gemini (free tier), anthropic (paid, strongest). */
          object Brain {
              val providers = listOf("groq", "gemini", "anthropic")
              val defModel = mapOf("groq" to "llama-3.3-70b-versatile", "gemini" to "gemini-flash-latest", "anthropic" to "claude-sonnet-5-5")
              private val hist = ArrayList<Pair<String, String>>()

              fun prov() = Prefs.get("prov", "groq")
              fun key(p: String = prov()) = Prefs.get("key_$p")
              fun model(p: String = prov()) = Prefs.get("model_$p").ifBlank { defModel[p] ?: "" }

              private fun system(): String {
                  val mode = if (Prefs.get("mode", "personal") == "commercial")
                      "COMMERCIAL mode: act as a sharp business strategist (growth, content, revenue, metrics, decisions)."
                  else "PERSONAL mode: be warm, practical and concise."
                  return "You are ${Prefs.get("name", "Jarvis")}, a composed, brilliant, slightly dry-witted male AI butler in the spirit of J.A.R.V.I.S. " +
                      "Address the user as ${Prefs.get("user", "Sir")}. $mode Reply in the language the user speaks (default ${Prefs.get("lang", "en-US")}). " +
                      "Your words are spoken aloud: at most 3 short sentences, no markdown, no lists, no emojis. Now: ${Date()}."
              }

              fun ask(q: String, cb: (String) -> Unit) {
                  val p = prov()
                  if (key(p).isBlank()) { cb("Add your $p key in the Brain tab first."); return }
                  thread {
                      val out = try {
                          hist.add("user" to q)
                          while (hist.size > 11) { hist.removeAt(0); hist.removeAt(0) }
                          val r = when (p) { "anthropic" -> anthropic(); "gemini" -> gemini(); else -> openai() }
                          hist.add("assistant" to r); r
                      } catch (e: Exception) {
                          if (hist.isNotEmpty()) hist.removeAt(hist.size - 1)
                          if (e.message?.contains("429") == true) "I'm being rate limited. Give me a minute."
                          else "My brain returned an error. Check the key and model in settings."
                      }
                      Handler(Looper.getMainLooper()).post { cb(out) }
                  }
              }

              private fun openai(): String {
                  val a = JSONArray().put(JSONObject().put("role", "system").put("content", system()))
                  hist.forEach { a.put(JSONObject().put("role", it.first).put("content", it.second)) }
                  val r = JSONObject(String(Net.post("https://api.groq.com/openai/v1/chat/completions", mapOf("authorization" to "Bearer ${key()}"),
                      JSONObject().put("model", model()).put("max_tokens", 350).put("messages", a))))
                  return r.getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
              }

              private fun gemini(): String {
                  val a = JSONArray()
                  hist.forEach { a.put(JSONObject().put("role", if (it.first == "user") "user" else "model").put("parts", JSONArray().put(JSONObject().put("text", it.second)))) }
                  val body = JSONObject().put("contents", a)
                      .put("system_instruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", system()))))
                      .put("generationConfig", JSONObject().put("maxOutputTokens", 900))
                  val r = JSONObject(String(Net.post("https://generativelanguage.googleapis.com/v1beta/models/${model()}:generateContent", mapOf("x-goog-api-key" to key()), body)))
                  val parts = r.getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts")
                  return buildString { for (i in 0 until parts.length()) append(parts.getJSONObject(i).optString("text")) }.trim()
              }

              private fun anthropic(): String {
                  val a = JSONArray()
                  hist.forEach { a.put(JSONObject().put("role", it.first).put("content", it.second)) }
                  val r = JSONObject(String(Net.post("https://api.anthropic.com/v1/messages", mapOf("x-api-key" to key(), "anthropic-version" to "2023-06-01"),
                      JSONObject().put("model", model()).put("max_tokens", 400).put("system", system()).put("messages", a))))
                  return r.getJSONArray("content").getJSONObject(0).getString("text").trim()
              }
          }
          JVEOF9
          mkdir -p $(dirname 'app/src/main/java/com/jarvis/app/Voice.kt')
          cat > 'app/src/main/java/com/jarvis/app/Voice.kt' <<'JVEOF10'
          package com.jarvis.app
          import android.content.Context
          import android.media.MediaPlayer
          import android.os.Handler
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.util.Base64
          import org.json.JSONObject
          import java.io.File
          import java.util.Locale
          import kotlin.concurrent.thread

          /** Engines: android (built-in), eleven (ElevenLabs), google (Google Cloud TTS). Cloud failure falls back to built-in. */
          object Voice {
              private var tts: TextToSpeech? = null
              private var mp: MediaPlayer? = null
              private lateinit var app: Context
              private val main = Handler(Looper.getMainLooper())
              private var ready = false
              private var gen = 0

              fun init(c: Context) {
                  app = c.applicationContext
                  if (tts == null) tts = TextToSpeech(app) { ready = it == TextToSpeech.SUCCESS }
              }

              fun stop() { gen++; tts?.stop(); mp?.release(); mp = null }

              fun speak(text: String, onStart: () -> Unit = {}, onEnd: () -> Unit = {}) {
                  stop()
                  val my = gen
                  val e = Prefs.get("engine", "android")
                  if (e == "android") { local(text, onStart, onEnd); return }
                  thread {
                      try {
                          val bytes = if (e == "eleven") eleven(text) else google(text)
                          val f = File(app.cacheDir, "jarvis_voice.mp3"); f.writeBytes(bytes)
                          main.post { if (my == gen) play(f, onStart, onEnd) }
                      } catch (x: Exception) { main.post { if (my == gen) local(text, onStart, onEnd) } }
                  }
              }

              private fun play(f: File, onStart: () -> Unit, onEnd: () -> Unit) {
                  mp = MediaPlayer().apply {
                      setDataSource(f.path)
                      setOnPreparedListener { start(); onStart() }
                      setOnCompletionListener { onEnd() }
                      setOnErrorListener { _, _, _ -> onEnd(); true }
                      prepareAsync()
                  }
              }

              private fun local(text: String, onStart: () -> Unit, onEnd: () -> Unit) {
                  val t = tts
                  if (t == null || !ready) { main.post { onEnd() }; return }
                  val lang = Prefs.get("lang", "en-US")
                  t.language = Locale.forLanguageTag(lang)
                  t.setPitch(0.7f); t.setSpeechRate(0.95f)
                  t.voices?.firstOrNull { it.locale.toLanguageTag() == lang && it.name.contains("male", true) && !it.name.contains("female", true) }?.let { t.voice = it }
                  t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) { main.post { onStart() } }
                      override fun onDone(id: String?) { main.post { onEnd() } }
                      override fun onError(id: String?) { main.post { onEnd() } }
                  })
                  t.speak(text, TextToSpeech.QUEUE_FLUSH, null, "j")
              }

              private fun eleven(t: String): ByteArray {
                  val id = Prefs.get("elVoice", "pNInz6obpgDQGcFmaJgB")
                  val body = JSONObject().put("text", t).put("model_id", Prefs.get("elModel", "eleven_flash_v2_5"))
                      .put("voice_settings", JSONObject().put("stability", 0.45).put("similarity_boost", 0.8).put("style", 0.3))
                  return Net.post("https://api.elevenlabs.io/v1/text-to-speech/$id?output_format=mp3_44100_128", mapOf("xi-api-key" to Prefs.get("elKey")), body)
              }

              private fun google(t: String): ByteArray {
                  val v = Prefs.get("gVoice", "en-GB-Neural2-D")
                  val body = JSONObject().put("input", JSONObject().put("text", t))
                      .put("voice", JSONObject().put("languageCode", v.split("-").take(2).joinToString("-")).put("name", v))
                      .put("audioConfig", JSONObject().put("audioEncoding", "MP3"))
                  val r = JSONObject(String(Net.post("https://texttospeech.googleapis.com/v1/text:synthesize?key=" + Prefs.get("gKey"), emptyMap(), body)))
                  return Base64.decode(r.getString("audioContent"), Base64.DEFAULT)
              }
          }
          JVEOF10
          mkdir -p $(dirname 'app/src/main/java/com/jarvis/app/Actions.kt')
          cat > 'app/src/main/java/com/jarvis/app/Actions.kt' <<'JVEOF11'
          package com.jarvis.app
          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread

          object Actions {
              /** True if handled locally (reply goes through say); false -> send to the AI brain. */
              fun handle(c: Context, raw: String, say: (String) -> Unit): Boolean {
                  val t = raw.trim().lowercase().trimEnd('.', '!', '?')
                  fun go(i: Intent) { i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); c.startActivity(i) }
                  fun acc(f: (JarvisAccess) -> Boolean, ok: String) {
                      val a = JarvisAccess.inst
                      say(if (a == null) "Enable my accessibility access first, in the Home tab." else if (f(a)) ok else "I couldn't do that on this screen.")
                  }
                  fun glob(a: Int, ok: String) = acc({ it.performGlobalAction(a) }, ok)
                  val click = Regex("^(?:click|tap|press) (?:on )?(.+)$").find(t)
                  val yt = Regex("^play (.+) on youtube$").find(t) ?: Regex("^youtube (.+)$").find(t)
                  val web = Regex("^(?:search|google|look up) (?:for )?(.+)$").find(t)
                  val dial = Regex("^call ([0-9 +]+)$").find(t)
                  val open = Regex("^(?:open|launch|start) (.+)$").find(t)
                  when {
                      Regex("what('s| is) the time|time is it|current time").containsMatchIn(t) ->
                          say("It's " + SimpleDateFormat("h:mm a", Locale.getDefault()).format(Date()) + ".")
                      "date" in t && ("today" in t || "what" in t) ->
                          say("Today is " + SimpleDateFormat("EEEE, MMMM d", Locale.getDefault()).format(Date()) + ".")
                      t in listOf("go home", "home screen", "go to home") -> glob(AccessibilityService.GLOBAL_ACTION_HOME, "Home.")
                      t in listOf("go back", "back") -> glob(AccessibilityService.GLOBAL_ACTION_BACK, "Back.")
                      "recent apps" in t -> glob(AccessibilityService.GLOBAL_ACTION_RECENTS, "Recent apps.")
                      "open notifications" in t || t == "notifications" -> glob(AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS, "Here are your notifications.")
                      "screenshot" in t ->
                          if (Build.VERSION.SDK_INT >= 28) glob(AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT, "Done.") else say("Screenshots need Android 9 or newer.")
                      t.startsWith("scroll down") -> acc({ it.scroll(true) }, "Scrolling.")
                      t.startsWith("scroll up") -> acc({ it.scroll(false) }, "Scrolling.")
                      click != null -> { val x = click.groupValues[1]; acc({ it.clickText(x) }, "Done.") }
                      Regex("how('s| is) my channel|channel stats|youtube stats|my subscribers").containsMatchIn(t) -> channel(say)
                      yt != null -> { val q = yt.groupValues[1]; go(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(q)))); say("Playing $q on YouTube.") }
                      web != null -> { val q = web.groupValues[1]; go(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=" + Uri.encode(q)))); say("Searching for $q.") }
                      dial != null -> { go(Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + dial.groupValues[1].replace(" ", "")))); say("Dialing.") }
                      open != null -> {
                          val q = open.groupValues[1]
                          val pm = c.packageManager
                          val apps = pm.getInstalledApplications(0)
                          val app = apps.firstOrNull { pm.getApplicationLabel(it).toString().lowercase() == q }
                              ?: apps.firstOrNull { pm.getApplicationLabel(it).toString().lowercase().contains(q) }
                          val i = app?.let { pm.getLaunchIntentForPackage(it.packageName) }
                          if (app == null || i == null) say("I couldn't find $q on this device.")
                          else { go(i); say("Opening ${pm.getApplicationLabel(app)}.") }
                      }
                      else -> return false
                  }
                  return true
              }

              private fun channel(say: (String) -> Unit) {
                  val k = Prefs.get("ytKey"); val ch = Prefs.get("ytChannel")
                  if (k.isBlank() || ch.isBlank()) { say("Add your YouTube key and channel ID in the Alerts tab."); return }
                  thread {
                      val msg = try {
                          val s = JSONObject(Net.get("https://www.googleapis.com/youtube/v3/channels?part=statistics&id=$ch&key=$k"))
                              .getJSONArray("items").getJSONObject(0).getJSONObject("statistics")
                          Prefs.get("user", "Sir") + ", you have " + s.getString("subscriberCount") + " subscribers, " +
                              s.getString("viewCount") + " total views and " + s.getString("videoCount") + " videos."
                      } catch (e: Exception) { "I couldn't fetch your channel stats." }
                      Handler(Looper.getMainLooper()).post { say(msg) }
                  }
              }
          }
          JVEOF11
          mkdir -p $(dirname 'app/src/main/java/com/jarvis/app/JarvisAccess.kt')
          cat > 'app/src/main/java/com/jarvis/app/JarvisAccess.kt' <<'JVEOF12'
          package com.jarvis.app
          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class JarvisAccess : AccessibilityService() {
              companion object { var inst: JarvisAccess? = null }
              override fun onServiceConnected() { inst = this }
              override fun onUnbind(i: Intent?): Boolean { inst = null; return super.onUnbind(i) }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun clickText(t: String): Boolean {
                  val root = rootInActiveWindow ?: return false
                  var n: AccessibilityNodeInfo? = root.findAccessibilityNodeInfosByText(t).firstOrNull()
                  while (n != null && !n.isClickable) n = n.parent
                  return n?.performAction(AccessibilityNodeInfo.ACTION_CLICK) ?: false
              }

              fun scroll(down: Boolean): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val s = findScrollable(root) ?: return false
                  return s.performAction(if (down) AccessibilityNodeInfo.ACTION_SCROLL_FORWARD else AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD)
              }

              private fun findScrollable(n: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  if (n.isScrollable) return n
                  for (i in 0 until n.childCount) { val c = n.getChild(i) ?: continue; findScrollable(c)?.let { return it } }
                  return null
              }
          }
          JVEOF12
          mkdir -p $(dirname 'app/src/main/java/com/jarvis/app/BootReceiver.kt')
          cat > 'app/src/main/java/com/jarvis/app/BootReceiver.kt' <<'JVEOF13'
          package com.jarvis.app
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.provider.Settings
          import androidx.core.content.ContextCompat

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  try { if (Settings.canDrawOverlays(c)) ContextCompat.startForegroundService(c, Intent(c, OverlayService::class.java)) } catch (e: Exception) {}
              }
          }
          JVEOF13
          mkdir -p $(dirname 'app/src/main/java/com/jarvis/app/OrbView.kt')
          cat > 'app/src/main/java/com/jarvis/app/OrbView.kt' <<'JVEOF14'
          package com.jarvis.app
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.*
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.sin

          /** Glass bubble orb. state: 0 idle, 1 listening, 2 thinking, 3 speaking. */
          class OrbView(c: Context) : View(c) {
              var state = 0
              var level = 0f
              private var angle = 0f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val anim = ValueAnimator.ofFloat(0f, 360f).apply {
                  duration = 4000; repeatCount = ValueAnimator.INFINITE; interpolator = LinearInterpolator()
                  addUpdateListener { angle = it.animatedValue as Float; invalidate() }
              }
              override fun onAttachedToWindow() { super.onAttachedToWindow(); anim.start() }
              override fun onDetachedFromWindow() { anim.cancel(); super.onDetachedFromWindow() }

              override fun onDraw(cv: Canvas) {
                  val cx = width / 2f; val cy = height / 2f
                  val base = minOf(width, height) / 2f
                  val k = when (state) { 1 -> 1.04f + 0.1f * level; 3 -> 1f + 0.05f * sin(Math.toRadians(angle * 6.0)).toFloat(); else -> 1f }
                  val r = base * 0.76f * k
                  val sp = if (state == 2) 2.6f else 1f
                  val cyan = 0xFF00E5FF.toInt()
                  // outer glow
                  p.shader = null; p.style = Paint.Style.STROKE
                  for (i in 1..7) { p.strokeWidth = base * 0.04f; p.color = Color.argb(70 - i * 9, 0, 229, 255); cv.drawCircle(cx, cy, r + i * base * 0.03f, p) }
                  // dark glass body
                  p.style = Paint.Style.FILL
                  p.shader = RadialGradient(cx, cy, r, intArrayOf(0xFF000000.toInt(), 0xFF01061F.toInt(), 0xFF0A2BD0.toInt()), floatArrayOf(0f, 0.62f, 1f), Shader.TileMode.CLAMP)
                  cv.drawCircle(cx, cy, r, p)
                  // rotating inner blue light + band
