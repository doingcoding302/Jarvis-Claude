          package com.jarvis.app
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.*
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.PI
          import kotlin.math.sin

          /** Animated voice waveform; set amp (0..1). */
          class WaveView(c: Context) : View(c) {
              var amp = 0.12f
              private var a = 0.12f
              private var phase = 0f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeWidth = 3.5f }
              private val an = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 1000; repeatCount = ValueAnimator.INFINITE; interpolator = LinearInterpolator()
                  addUpdateListener { phase += 0.2f; a += (amp - a) * 0.15f; invalidate() }
              }
              override fun onAttachedToWindow() { super.onAttachedToWindow(); an.start() }
              override fun onDetachedFromWindow() { an.cancel(); super.onDetachedFromWindow() }
              override fun onDraw(cv: Canvas) {
                  val h = height / 2f
                  for (j in 0..2) {
                      val path = Path(); path.moveTo(0f, h)
                      var x = 0
                      while (x <= width) {
                          val env = sin(PI * x / width).toFloat()
                          val y = h + sin(x * 0.028f * (1 + j * 0.45f) + phase * (1 + j * 0.5f)) * h * a * env * (1f - j * 0.28f)
                          path.lineTo(x.toFloat(), y); x += 6
                      }
                      p.color = Color.argb(255 - j * 85, 0, 229, 255)
                      cv.drawPath(path, p)
                  }
              }
          }
