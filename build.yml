      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: jarvis
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-build-${{ github.run_number }}
          name: Jarvis build ${{ github.run_number }}
          files: jarvis/app/build/outputs/apk/debug/app-debug.apk
